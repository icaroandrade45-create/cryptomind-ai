<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CryptoMind AI</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>

                <div class="container">

                    <div class="logo">
                            <h1>CryptoMind AI</h1>
                                    <p>Plataforma Inteligente para Análise de Criptomoedas</p>
                                        </div>

                                            <div class="login-box">

                                                    <h2>Entrar</h2>

                                                            <form id="loginForm">

                                                                        <input
                                                                                        type="email"
                                                                                                        id="email"
                                                                                                                        placeholder="E-mail"
                                                                                                                                        required
                                                                                                                                                    >

                                                                                                                                                                <input
                                                                                                                                                                                type="password"
                                                                                                                                                                                                id="senha"
                                                                                                                                                                                                                placeholder="Senha"
                                                                                                                                                                                                                                required
                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                        <button type="submit">
                                                                                                                                                                                                                                                                        Entrar
                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                    <button type="button" id="cadastroBtn">
                                                                                                                                                                                                                                                                                                                Criar conta
                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                <p id="mensagem"></p>

                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                    <script type="module" src="app.js"></script>

                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                    </html>
